<Input edr_log>
	Module		im_file
	File		"C:\\path\\to\\spiEDR\\logs\\spiedr.log"
	SavePos		TRUE
	ReadFromLast	TRUE
</Input>

<Output remote_syslog>
	Module		om_tcp
	Host		<SYSLOG_HOST>
	Port		514
	Exec $SourceName = 'spiEDR';
	Exec		to_syslog_bsd();
</Output>

<Route edr_to_syslog>
	Path		edr_log => remote_syslog
</Route>
